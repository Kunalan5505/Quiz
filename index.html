<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two Hearts | Couple Quiz</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#59243e,#180f23 75%);color:#fff4f7;font:16px system-ui;min-height:100dvh}main{max-width:540px;margin:auto;padding:32px 20px}h1{font-size:38px;margin:0}h2{font-size:24px}small,p{color:#eac1d3;line-height:1.6}section{background:#ffffff0c;border:1px solid #ffffff25;border-radius:24px;padding:22px;margin:18px 0}button,input,textarea{font:inherit;width:100%;padding:14px;border-radius:13px;margin:6px 0;border:1px solid #ffffff35}button{background:#f7a8c4;color:#39192a;font-weight:700;cursor:pointer}button.secondary{background:#ffffff10;color:white}button:disabled{opacity:.5}input,textarea{background:#200f24;color:white}textarea{min-height:100px}#status{font-size:13px;color:#f8b6cf}header{text-align:center}.scores{display:flex;justify-content:space-around;text-align:center}.scores b{display:block;font-size:26px}progress{width:100%;accent-color:#f7a8c4} .answer{white-space:pre-wrap;overflow-wrap:anywhere;background:#ffffff0b;padding:12px;border-radius:12px;margin:8px 0}</style>
<main><header><small>♡ LONG DISTANCE EDITION ♡</small><h1>Two Hearts</h1><p>One link. Two players. Five rounds.</p></header><div id="status" role="status"></div><div id="app"></div></main>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const rounds=[
['Know your partner',['Favourite food?','Dream holiday destination?','Ideal weekend?','Favourite way to receive affection?','Dream gift?','What is your biggest pet peeve?']],
['Truth or dare',[['What was your first impression of me?','Type three compliments for your partner.'],['What is your favourite memory of us?','Type a song title that reminds you of your partner and explain why.'],['What gives you butterflies?','Describe your funniest memory together in one sentence.'],['What is a funny habit of mine?','Make up a silly nickname for your partner.'],['What romantic surprise would you love?','Write a four-line love poem.'],['What little thing makes you miss me?','Describe our perfect date using only five words.']]],
['Most likely to',['Apologise first?','Fall asleep during a movie?','Plan a surprise date?','Forget where they put their phone?','Laugh at the wrong moment?','Steal the last bite of food?']],
['Would you rather',[['Luxury holiday','Cosy road trip'],['Dinner date','Weekend getaway'],['Relive our first date','See our future together'],['Love letter','Surprise gift'],['Dream house','Travel the world'],['Cook together','Order takeaway and watch a movie']]],
['Deep connection',['When did you realise I was special?','What makes you feel appreciated?','What is our biggest shared dream?','What could we improve together?','What promise would you like to make?','What new tradition should we start together?']]];
const app=document.querySelector('#app'),status=document.querySelector('#status'),room=new URLSearchParams(location.search).get('room'),host=!room;
let peer,conn,me=host?0:1,localName='',names=['',''],state={i:0,scores:[0,0],matches:0,eligible:0,answers:[null,null],ready:[false,false],started:false,judged:false,choice:null},connected=false,locked=false;
function el(tag,t,parent=app){let x=document.createElement(tag);if(t!==undefined)x.textContent=t;parent.append(x);return x}
function button(t,fn,parent=app,secondary=false){let b=el('button',t,parent);b.onclick=fn;if(secondary)b.className='secondary';return b}
function sync(){if(host&&conn?.open)conn.send({type:'state',state:{...state,answers:state.answers.every(a=>a!==null)?state.answers:[state.answers[0]===null?null:'Locked',state.answers[1]]},names});render()}
function action(type,value){if(host)apply(0,type,value);else if(conn?.open){conn.send({type,value});locked=true;render()}}
function apply(p,type,v){if(type==='name'&&!state.started){names[p]=String(v).slice(0,40);sync();return}
if(!state.started||state.i>=30)return;
const r=Math.floor(state.i/6);
if(type==='choice'&&r===1&&p===state.i%2&&!state.choice){state.choice=v;sync();return}
if(type==='answer'&&state.answers[p]===null){if(r===1&&p!==state.i%2)return;state.answers[p]=String(v).slice(0,1000);if(r===1){state.answers[1-p]='—';if(v!=='Pass')state.scores[p]+=2}
if(state.answers.every(a=>a!==null)&&[2,3].includes(r)&&!state.answers.includes('Pass')){state.eligible++;if(state.answers[0]===state.answers[1]){state.matches++;state.scores[0]++;state.scores[1]++}}sync();return}
if(type==='judge'&&r===0&&p!==state.i%2&&state.answers.every(a=>a!==null)&&!state.judged){state.judged=true;if(v===true&&!state.answers.includes('Pass'))state.scores[state.i%2]+=2;sync();return}
if(type==='ready'&&state.answers.every(a=>a!==null)&&(r!==0||state.judged)){state.ready[p]=true;if(state.ready.every(Boolean)){state.i++;state.answers=[null,null];state.ready=[false,false];state.judged=false;state.choice=null}sync()}}
function setup(c){if(conn&&conn!==c){c.close();return}conn=c;c.on('open',()=>{connected=true;status.textContent='Partner connected';if(host)sync();else c.send({type:'name',value:localName});render()});c.on('data',d=>{if(host)apply(1,d.type,d.value);else if(d.type==='state'){state=d.state;names=d.names;locked=false;render()}});c.on('close',()=>{connected=false;status.textContent='Connection closed. Start a new room to play again.';render()});c.on('error',()=>{status.textContent='Connection failed. Try a new room.'})}
function begin(){let id=host?'twohearts-'+crypto.randomUUID():undefined;try{peer=host?new Peer(id):new Peer();peer.on('open',()=>{status.textContent=host?'Room created — invite your partner':'Connecting to your partner…';if(host){names[0]=localName;render()}else setup(peer.connect(room,{reliable:true}))});peer.on('connection',setup);peer.on('error',e=>{status.textContent='Connection error: '+e.type+'. Try a new room or another network.'});}catch(e){status.textContent='Unable to start connection.'}}
function render(){app.replaceChildren();let card=el('section');
if(!localName){el('h2',host?'Create your game':'Join your partner',card);let inp=el('input',undefined,card);inp.placeholder='Your name';inp.maxLength=40;button(host?'Create room':'Join game',()=>{if(inp.value.trim()){localName=inp.value.trim();begin();render()}},card);el('p','30 questions • 5 rounds • Up to 24 points each. Keep the invitation private. Both players must stay online; some networks may block peer-to-peer connections.',card);return}
if(!state.started){el('h2',connected?'Ready to play?':'Waiting for your partner…',card);el('p',names.filter(Boolean).join(' ♡ ')||localName,card);if(host&&peer?.id){let url=new URL(location.href);url.search='';url.searchParams.set('room',peer.id);let input=el('input',undefined,card);input.readOnly=true;input.value=url.href;button('Copy invitation link',async()=>{try{await navigator.clipboard.writeText(url.href);status.textContent='Link copied! Send it to your partner.'}catch{input.select();status.textContent='Select and copy the link manually.'}},card);if(navigator.share)button('Share invitation',()=>navigator.share({title:'Two Hearts',url:url.href}).catch(()=>{}),card,true);if(connected&&names.every(Boolean))button('Start game',()=>{state.started=true;sync()},card)}return}
if(!connected){el('p','Your partner is disconnected. Reopen the original website to create a new room.',card);return}
let score=el('div',undefined,card);score.className='scores';names.forEach((n,j)=>{let a=el('div',n,score);el('b',state.scores[j],a)});
if(state.i>=30){el('h2',state.scores[0]===state.scores[1]?'It is a tie! 💕':names[state.scores[0]>state.scores[1]?0:1]+' wins! 🏆',card);let pct=state.eligible?Math.round(100*state.matches/state.eligible):null;el('h2',pct===null?'No matching questions answered':'💕 Answer match: '+pct+'%',card);if(pct!==null){el('p',state.matches+' of '+state.eligible+' answered matching questions • '+(pct>=90?'Perfect Duo':pct>=75?'Power Couple':pct>=60?'Lovebirds':pct>=40?'Opposites Attract':'Unexpected Duo'),card);el('p','Just for fun — not a measure of relationship compatibility.',card)}el('p','Winner chooses the next date. Thank each other for playing!',card);button('New game',()=>location.href=location.pathname,card);return}
let r=Math.floor(state.i/6),q=rounds[r][1][state.i%6],turn=state.i%2;let bar=el('progress',undefined,card);bar.max=30;bar.value=state.i;el('small','Round '+(r+1)+' of 5 • Question '+(state.i+1)+' of 30',card);el('h2',rounds[r][0],card);
if(r===1){el('p',names[turn]+'’s turn',card);if(!state.choice){if(me===turn){button('Truth',()=>action('choice',0+'t'),card);button('Dare',()=>action('choice',1+'d'),card)}else el('p','Waiting for your partner to choose…',card);return}el('h2',q[state.choice==='0t'?0:1],card)}else el('h2',Array.isArray(q)?'Would you rather…':q,card);
if(state.answers.every(a=>a!==null)){if([2,3].includes(r))el('h2',state.answers.includes('Pass')?'Question passed':state.answers[0]===state.answers[1]?'💞 Match! Both +1':'Different choices! ✨',card);if(r!==1)state.answers.forEach((a,j)=>{let box=el('div',names[j]+': '+a,card);box.className='answer'});else {let box=el('div',names[turn]+': '+state.answers[turn],card);box.className='answer'}
if(r===0&&!state.judged){if(me!==turn){if(!state.answers.includes('Pass'))button('Correct guess +2',()=>action('judge',true),card);button('Not quite',()=>action('judge',false),card,true)}else el('p','Waiting for your partner to judge…',card);return}
if(state.ready[me]||locked)el('p','Waiting for your partner…',card);else button('Next question',()=>action('ready',true),card);return}
if(locked||state.answers[me]!==null){el('p','Answer locked. Waiting for your partner…',card);return}
if(r===1){if(me!==turn){el('p','Waiting for your partner to finish their challenge…',card);return}let t=el('textarea',undefined,card);t.placeholder='Type your answer or challenge here…';button('Submit +2',()=>{if(t.value.trim())action('answer',t.value.trim())},card)}
else if(r===2||r===3){(r===2?names:q).forEach(a=>button(a,()=>action('answer',a),card))}
else{el('p',r===0?(me===turn?'Guess your partner’s answer.':'Answer about yourself.'): 'Both answer honestly. No points this round.',card);let t=el('textarea',undefined,card);t.placeholder='Your answer…';button('Lock answer',()=>{if(t.value.trim())action('answer',t.value.trim())},card)}
button('Pass',()=>action('answer','Pass'),card,true)}
render();
</script></html>
