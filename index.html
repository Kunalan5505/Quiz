function badges(){let rs=state.results,m=rs.filter(x=>x.match),future=rs.filter(x=>x.round===4&&x.match),conf=rs.filter(x=>x.round===5&&x.score!==null),accurate=rs.filter(x=>x.type==='know'&&x.ratings).flatMap(x=>x.ratings).filter(x=>x===10).length;return[['💘 First Spark',m.length>0],['🔥 Love Streak ×3',state.best>=3],['💞 Unstoppable Love',state.best>=5],['🧠 Mind Reader',accurate>=3],['💍 Future Builders',future.length===6],['💌 Open Hearts',conf.length===6],['💎 Perfect Chemistry',rs.some(x=>x.ratings?.every(v=>v===10))],['👑 Couple Goals',ROUND_NAMES.some((_,i)=>{let a=rs.filter(x=>x.round===i);return a.length===6&&a.every(x=>x.score===10)})],['🏆 Two Hearts Champions',state.stage==='result'],['⭐ All 36 answered',rs.filter(x=>x.score!==null).length===36]]}
function playSound(){if(!sound||!audio)return;try{audio.resume();for(let i=0;i<3;i++){let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.12;o.type='sine';o.frequency.value=[523,659,784][i];g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.22)}}catch{}}
function celebrate(id){if(lastCelebration===id)return;lastCelebration=id;playSound();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let j=0;j<12;j++){let e=el('span',j%2?'♡':'✧',document.body);e.className='spark';e.style.left=(8+Math.random()*84)+'%';e.style.top=(35+Math.random()*40)+'%';e.style.color='var(--accent)';setTimeout(()=>e.remove(),1700)}}
function favorite(label,value,p){let id=state.pos+':'+label;button(favorites.some(x=>x.id===id)?'♡ Saved to favourites':'♡ Save favourite answer',()=>{if(!favorites.some(x=>x.id===id))favorites.push({id,label,value});render()},p,true)}
function ready(p){if(state.ready[me]||pending)note('Waiting for your partner to continue…',p);else button('Both ready? Continue →',()=>action('ready',true),p)}
function roundReport(r,p){let list=state.results.filter(x=>x.round===r),s=scoreStats(list);el('h2',ROUND_NAMES[r],p);let n=el('div',s.pct===null?'No scored answers':fmt(s.pct)+'%',p);n.className='big center';bar(s.pct||0,p);note(fmt(s.points)+' / '+s.count*10+' points · '+s.count+'/6 scored questions',p)}
function resultCard(p){let s=scoreStats(state.results);let h=el('div','♡',p);h.className='heart center';el('h2',couple(s.pct),p).className='center';el('div',s.pct===null?'—':fmt(s.pct)+'%',p).className='big center';note(names.join(' ♡ '),p);note(fmt(s.points)+' / '+s.count*10+' points · '+s.count+'/36 scored questions',p);
note('A playful game result, not a measure of your relationship or compatibility.',p);el('hr',undefined,p).className='sep';
ROUND_NAMES.forEach((n,r)=>{let t=scoreStats(state.results.filter(x=>x.round===r));el('div',n+' — '+(t.pct===null?'—':fmt(t.pct)+'%'),p);bar(t.pct||0,p)});
let matches=state.results.filter(x=>x.type==='mc'&&x.score!==null),manual=state.results.filter(x=>x.ratings),pred=state.results.flatMap(x=>x.predictions||[]),st=scoreStats(manual);
let row=el('div',undefined,p);row.className='row';for(let [label,val] of [['Matching answers',matches.filter(x=>x.match).length+'/'+matches.length],['Longest streak',String(state.best)+' 🔥']]){let a=el('div',undefined,row);a.className='stat';el('b',val,a);el('small',label,a)}
row=el('div',undefined,p);row.className='row';for(let [label,val] of [['Average manual score',st.count?fmt(st.points/st.count)+'/10':'—'],['Predictions correct',pred.filter(Boolean).length+'/'+pred.length]]){let a=el('div',undefined,row);a.className='stat';el('b',val,a);el('small',label,a)}
let rr=ROUND_NAMES.map((n,i)=>({n,pct:scoreStats(state.results.filter(x=>x.round===i)).pct})).filter(x=>x.pct!==null).sort((a,b)=>b.pct-a.pct);if(rr.length){el('h3','Highest-scoring round',p);el('p',rr[0].n,p);el('h3','Conversation starter',p);el('p','Share your perspectives from '+rr[rr.length-1].n+' — without trying to change each other’s answers.',p)}
el('h3','Your achievements',p);badges().forEach(([n,on])=>tag((on?'✓ ':'○ ')+n,p));
if(state.finalMessages){el('h3','💌 Your secret messages',p);state.finalMessages.forEach((m,i)=>boxAnswer(names[i],m,p))}
if(favorites.length){el('h3','Your saved favourite answers',p);favorites.forEach(x=>boxAnswer(x.label,x.value,p))}
el('h3','🎁 Date reward',p);el('p',['Plan a surprise date for each other.','Choose a new cafe to explore together.','Make a shared playlist.','Plan a picnic or sunset walk.','Write each other a sweet note.'][Math.floor(state.best+state.results.length)%5],p);
button('Download result card',downloadResult,p);button('Share result text',async()=>{let t='Two Hearts V3: '+names.join(' ♡ ')+' — '+couple(s.pct)+' '+(s.pct===null?'':fmt(s.pct)+'%');try{if(navigator.share)await navigator.share({text:t});else await navigator.clipboard.writeText(t);setStatus('Result ready to share.')}catch{setStatus('Sharing unavailable on this browser.')}},p,true);button('Play again / new room',newGame,p,true);celebrate('final')}
function downloadResult(){let s=scoreStats(state.results),c=document.createElement('canvas');c.width=1080;c.height=1350;let x=c.getContext('2d');x.fillStyle='#241525';x.fillRect(0,0,c.width,c.height);x.textAlign='center';x.fillStyle='#f5a8c8';x.font='bold 40px sans-serif';x.fillText('TWO HEARTS V3',540,100);x.font='bold 58px sans-serif';x.fillText(names.join(' ♡ ').slice(0,40),540,185,960);x.font='bold 150px sans-serif';x.fillText(s.pct===null?'—':fmt(s.pct)+'%',540,365);x.fillStyle='#fff5f8';x.font='bold 52px sans-serif';x.fillText(couple(s.pct).replace(/^[^ ]+ /,''),540,440,960);x.font='30px sans-serif';x.fillText(s.count+'/36 scored questions',540,500);ROUND_NAMES.forEach((n,i)=>{let v=scoreStats(state.results.filter(a=>a.round===i)).pct,y=600+i*98;x.textAlign='left';x.fillStyle='#fff5f8';x.font='bold 30px sans-serif';x.fillText(n.replace(/^[^ ]+ /,''),90,y,780);x.textAlign='right';x.fillText(v===null?'—':fmt(v)+'%',990,y);x.fillStyle='#503347';x.fillRect(90,y+20,900,14);x.fillStyle='#f5a8c8';x.fillRect(90,y+20,900*(v||0)/100,14)});x.textAlign='center';x.font='24px sans-serif';x.fillStyle='#d6b5ca';x.fillText('Just for fun • Not a relationship assessment',540,1280);c.toBlob(b=>{if(!b)return;let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='two-hearts-result.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)},'image/png')}
function render(){app.replaceChildren();let p=el('section');
if(!localName){el('h2',host?'Start your date night':'Join your partner ♡',p);let inp=el('input',undefined,p);inp.placeholder='Your name';inp.maxLength=40;let random=null,rapid=null;if(host){let l=el('label',undefined,p);random=el('input',undefined,l);random.type='checkbox';l.append('Shuffle from the 100-question bank');l=el('label',undefined,p);rapid=el('input',undefined,l);rapid.type='checkbox';rapid.checked=true;l.append('Enable 15-second rapid fire challenges');ROUND_NAMES.forEach(n=>{let a=el('div',n+' · 6 questions',p);a.className='roundline'})}
button(host?'Create private room':'Join game',()=>{let n=inp.value.trim();if(!n)return inp.focus();if(host)newRoom(n,random.checked,rapid.checked);else{localName=n;guestToken=crypto.randomUUID();save(GKEY,{localName,guestToken});startPeer();render()}},p);note('36 scored questions • 6 rounds • 5 optional mystery prompts • 1 secret finale. No login. No photos, calls or voice notes. Keep your invitation private.',p);return}
if(!state?.started){el('h2',connected?'Ready to play?':'Waiting for your partner…',p);el('p',names.filter(Boolean).join(' ♡ ')||localName,p);if(host&&peer?.open){let u=new URL(location.href);u.search='';u.searchParams.set('room',hostId);let inp=el('input',undefined,p);inp.value=u.href;inp.readOnly=true;button('Copy invitation link',async()=>{try{await navigator.clipboard.writeText(u.href);setStatus('Invitation copied. Send it privately.')}catch{inp.select();setStatus('Select and copy the link.')}},p);if(navigator.share)button('Share invitation',()=>navigator.share({title:'Two Hearts V3',url:u.href}).catch(()=>{}),p,true);if(connected&&names.every(Boolean))button('Start our game ♡',()=>{state.started=true;state.deadline=item()?.rapid?Date.now()+15000:null;publish()},p)}note('Both players should stay online. If disconnected, reopen this tab to reconnect. Some networks may block the connection.',p);button('Leave / new room',newGame,p,true);return}
if(state.stage==='result'){resultCard(p);return}
if(!connected){el('h2','Reconnecting…',p);note('Your progress is held on the host device. Keep this tab open, or reload it if needed. The guest should use the original invitation.',p);button('Leave / new room',newGame,p,true);return}
let q=item();if(!q)return;let s=scoreStats(state.results);el('div',names.join(' ♡ '),p).className='center eyebrow';bar(state.results.length/36*100,p);note(state.results.length+'/36 questions processed · Shared score '+(s.pct===null?'—':fmt(s.pct)+'%')+(state.streak?' · 🔥 Streak '+state.streak:''),p);
if(state.stage==='summary'){roundReport(q.round,p);el('h3','Achievements unlocked',p);let unlocked=badges().filter(x=>x[1]);if(!unlocked.length)note('Your next achievement is waiting!',p);unlocked.forEach(([n])=>tag(n,p));ready(p);celebrate('round'+q.round);return}
tag(q.type==='mystery'?'🎲 Mystery bonus · unscored':q.type==='finale'?'💌 Secret finale · unscored':'Round '+(q.round+1)+' of 6 · Question '+q.num+'/36',p);if(q.predict)tag('🔮 Predict your partner',p);if(q.rapid)tag('⚡ Rapid fire',p);el('h2',q.q,p);
if(state.stage==='answer'){if(q.rapid&&state.deadline){let t=el('div',undefined,p);t.id='timer';t.className='timer center';tick()}if(pending||state.responses[me]!==null){note('Answer locked. Waiting for your partner…',p);return}
if(q.type==='mc'){optionList('Your choice',q.opts,'answer',p);if(q.predict)optionList('Predict your partner’s choice (bonus, unscored)',q.opts,'guess',p);let b=button('Lock answer',()=>action('answer',{answer:drafts[key('answer')],guess:drafts[key('guess')]}),p);b.disabled=!drafts[key('answer')]||(q.predict&&!drafts[key('guess')])}
else if(q.type==='know'){note('Answer the question about yourself, then guess your partner’s answer to the same question.',p);let a=field('Your actual answer','answer',p),g=field('Your guess about '+names[1-me],'guess',p);button('Lock both answers',()=>{if(a.value.trim()&&g.value.trim())action('answer',{answer:a.value,guess:g.value});else note('Please complete both fields or skip.',p)},p)}
else{let t=field(q.type==='finale'?'Your private message':'Your answer','answer',p);button('Lock answer',()=>{if(t.value.trim())action('answer',{answer:t.value});else t.focus()},p)}
button('Skip this question',()=>action('answer',SKIP),p,true);return}
if(state.responses.some(skipped)){note('One player skipped. This question is not scored; private answers stay hidden on the game screen.',p);ready(p);return}
if(q.type==='know'){state.responses.forEach((a,i)=>{boxAnswer(names[i]+' — actual answer',a.answer,p);boxAnswer(names[1-i]+' — guess',state.responses[1-i].guess,p)})}else{state.responses.forEach((a,i)=>{boxAnswer(names[i],a.answer,p);if(q.predict)note(names[i]+' predicted: '+a.guess,p)})}
if(state.stage==='rate'){if(state.ratings[me]!==null||pending){note('Your rating is locked. Waiting for your partner…',p);return}
el('hr',undefined,p).className='sep';el('h3',q.type==='know'?'How accurately did '+names[1-me]+' guess your answer?':'How much do you appreciate '+names[1-me]+'’s answer?',p);
if(q.type==='know'){[[10,'Exactly correct — 10'],[5,'Almost correct — 5'],[0,'Not correct — 0']].forEach(([v,t])=>button(t,()=>action('rate',v),p,true))}
else{note('Rate the response, not your partner’s worth or boundaries.',p);let a=el('div',undefined,p);a.className='ratings';for(let v=1;v<=10;v++)button(String(v),()=>action('rate',v),a,true)}
button('Skip rating',()=>action('rate',SKIP),p,true);return}
if(state.stage==='reveal'){let rec=state.results.find(x=>x.num===q.num);if(rec){let [emoji,title,desc]=reaction(rec);el('hr',undefined,p).className='sep';el('div',emoji,p).className='heart center';el('h2',title,p).className='center';el('div',rec.score===null?'Unscored':fmt(rec.score)+'/10',p).className='big center';note(desc,p);if(rec.ratings){note(names[0]+' rated '+fmt(rec.ratings[0])+' · '+names[1]+' rated '+fmt(rec.ratings[1])+' · Difference '+Math.abs(rec.ratings[0]-rec.ratings[1]),p)}if(rec.predictions?.length)note('Prediction bonus: '+rec.predictions.filter(Boolean).length+'/2 correct · No extra points',p);if(rec.match&&state.streak>=3)tag('🔥 Love streak ×'+state.streak,p);if(rec.score===10)celebrate('q'+q.num)}else note('♡ A little extra connection — no points.',p);favorite(names[1-me],state.responses[1-me].answer,p);ready(p)}}
function tick(){let e=document.getElementById('timer');if(!state||!item()?.rapid||state.stage!=='answer'||!state.deadline)return;let seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));if(e)e.textContent=seconds+' seconds left';if(host&&connected&&seconds===0){state.responses=state.responses.map(a=>a??SKIP);reveal();publish()}}
setInterval(tick,250);
let themeBtn=document.getElementById('theme'),soundBtn=document.getElementById('sound');try{if(localStorage.getItem('th-theme')==='light')document.body.classList.add('light')}catch{}themeBtn.onclick=()=>{document.body.classList.toggle('light');try{localStorage.setItem('th-theme',document.body.classList.contains('light')?'light':'dark')}catch{}};soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'🔊 Sound':'🔇 Sound';if(sound){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();playSound()}catch{}}};
if(host){let old=read(KEY);if(old?.hostId&&old?.state?.deck&&old.state.stage!=='result'){state=old.state;names=old.names;localName=names[0];hostId=old.hostId;guestToken=old.guestToken||'';startPeer()}}else{let old=read(GKEY);if(old?.guestToken&&old.localName){guestToken=old.guestToken;localName=old.localName;startPeer()}}
render();
</script></body></html>
